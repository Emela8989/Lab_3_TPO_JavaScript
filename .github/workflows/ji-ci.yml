name: JavaScript CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm' # Кэшируем зависимости, чтобы пайплайн работал быстрее

    - name: Install dependencies
      run: npm install

    - name: Run tests with coverage
      run: npm test